[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers -m "not hardware"
markers =
    hardware: tests requiring real physical JBL Bluetooth hardware (requires --hardware flag and JBL_BD)
    cli: end-to-end tests for CLI commands
    tui: end-to-end tests for Textual TUI interface
    protocol: unit tests for Airoha RACE frame building, parsing, and checksums
    fault: fault injection tests simulating failures
    health: battery health, cycle estimation, and retention tests
